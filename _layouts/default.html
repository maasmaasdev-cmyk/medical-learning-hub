<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if site.google_site_verification != '' %}<meta name="google-site-verification" content="{{ site.google_site_verification }}">{% endif %}
  {% if site.adsense_client != '' %}<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client }}" crossorigin="anonymous"></script>{% endif %}
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  {% include header.html %}
  <main id="main" class="container">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
